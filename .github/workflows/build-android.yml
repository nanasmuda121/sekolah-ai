name: Build & Release NanasAi APK (Kotlin + C++)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build NanasAi Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Mengunduh gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x gradlew

      # Download model AI offline Qwen2.5-0.5B (~350MB) ke assets
      - name: Download Offline AI Model (Qwen2.5-0.5B GGUF)
        run: |
          mkdir -p app/src/main/assets/models
          echo "Mengunduh model Qwen2.5-0.5B-Instruct Q4_K_M..."
          curl -L -o app/src/main/assets/models/qwen2.5-0.5b-q4.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -lh app/src/main/assets/models/

      # Buat keystore otomatis untuk signing APK Release
      - name: Create Keystore for APK Signing
        run: |
          cd app
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NanasAi,O=AdnanFerdiansyah,C=ID"
          fi

      # Build APK Android Release murni Kotlin + C++
      - name: Build APK Release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Upload APK ke GitHub Artifacts
      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NanasAi-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Publikasikan ke GitHub Releases jika ada tag release (contoh: v1.0.0)
      - name: Publish ke GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
          name: "🍍 NanasAi ${{ github.ref_name }}"
          body: |
            ## 🍍 NanasAi — Belajar Tanpa Menunggu Wi-Fi.

            **Teman Belajar, Bahkan Saat Offline.**
            Diciptakan oleh **Adnan Ferdiansyah**.

            ### 🚀 Fitur Unggulan:
            - **100% Offline & Mandiri:** Dapat digunakan saat Wi-Fi mati, kuota habis, atau tanpa internet.
            - **Hemat RAM:** Dibangun dengan arsitektur **Kotlin + C++ Native**, sangat lancar di HP dengan RAM 750 MB – 1 GB.
            - **Dukungan Kamera (Vision):** Foto soal buku paket / lembar ujian matematika (Pythagoras, aljabar, dsb.) langsung dianalisis langkah demi langkah.
            - **Chatbot Edukasi Serba Bisa:** Matematika, Sejarah, Bahasa Inggris, PPKn, Agama, dll.
            - **Desain Modern:** Mengadopsi PromptBar micro-interaction ala ReactBits yang elegan.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
