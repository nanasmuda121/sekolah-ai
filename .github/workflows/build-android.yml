name: Build & Release Android Offline AI APK

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      # Unduh Model Offline Qwen2.5-0.5B Q4_K_M (~350 MB) ke folder assets
      - name: Download Offline AI Model (Qwen2.5-0.5B GGUF)
        run: |
          mkdir -p android/app/src/main/assets/models
          echo "Mengunduh model Qwen2.5-0.5B-Instruct Q4_K_M..."
          curl -L -o android/app/src/main/assets/models/qwen2.5-0.5b-q4.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -lh android/app/src/main/assets/models/

      # Buat debug.keystore jika belum ada untuk signing release
      - name: Create Keystore for APK Signing
        run: |
          cd android/app
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
          fi

      # Build APK Android
      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Upload file APK ke GitHub Artifacts (Dapat diunduh langsung di tab Actions)
      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SekolahAI-Offline-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Buat Rilis Otomatis di Tab Releases jika push tag git (contoh: v1.0.0)
      - name: Publish ke GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
          name: "Rilis Sekolah AI ${{ github.ref_name }}"
          body: |
            ## 🎓 Sekolah AI - Tutor Mandiri 100% Offline
            
            - **Mata Pelajaran:** Matematika (Pythagoras & Aljabar), Sejarah, B. Inggris, PKn, Agama.
            - **Dukungan Vision:** Kamera / Foto Soal & Deteksi Angka/Teks.
            - **Kompatibilitas:** Dirancang khusus untuk HP dengan RAM 1 GB ke bawah.
            - **Koneksi:** 100% Offline, tanpa kuota internet.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
